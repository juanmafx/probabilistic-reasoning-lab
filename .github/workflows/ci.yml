# Lint, type-check and test with least privilege and SHA-pinned actions.
name: CI

on:
  push:
    branches: [main, modernize/2026]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development tools
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type-check
        run: python -m mypy
      - name: Run tests and write the report
        run: python tools/generate_test_report.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-report-python-${{ matrix.python-version }}
          path: reports/tests/
          if-no-files-found: error
